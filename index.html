<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Thailandia Road Trip 2026-2027 | Premium Travel Hub</title>

    <!-- Impostazioni Mobile PWA App -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Thailandia 2026">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/201/201623.png">

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary: #0f172a;
            --accent-teal: #0d9488;
            --accent-teal-dark: #0b7f75;
            --accent-cyan: #06b6d4;
            --accent-gold: #f59e0b;
            --accent-purple: #8b5cf6;
            --gold-light: #fde047;
            --bg-light: #f8fafc;
            --card-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.06), 0 4px 6px -2px rgba(15, 23, 42, 0.03);
            --card-shadow-hover: 0 20px 40px -10px rgba(13, 148, 136, 0.15);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        /* ====== UTILITY COLORI ====== */
        .text-teal { color: var(--accent-teal) !important; }
        .bg-teal { background-color: var(--accent-teal) !important; color: #fff; }
        .bg-purple { background-color: var(--accent-purple) !important; color: #fff; }
        .section-label { letter-spacing: 0.8px; font-size: 0.75rem; text-transform: uppercase; }

        /* Bottoni primari personalizzati */
        .btn-primary {
            --bs-btn-bg: var(--accent-teal);
            --bs-btn-border-color: var(--accent-teal);
            --bs-btn-hover-bg: var(--accent-teal-dark);
            --bs-btn-hover-border-color: var(--accent-teal-dark);
            --bs-btn-active-bg: #0a6f66;
            --bs-btn-active-border-color: #0a6f66;
            --bs-btn-focus-shadow-rgb: 13, 148, 136;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
            transition: all 0.25s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(13, 148, 136, 0.35);
        }

        /* ====== HERO BANNER ====== */
        .hero-banner {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.88) 0%, rgba(13, 148, 136, 0.85) 100%),
                        url('https://images.unsplash.com/photo-1506665531195-3566af294710?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            color: white;
            padding: calc(70px + env(safe-area-inset-top, 0px)) 20px 60px 20px;
            border-radius: 0 0 40px 40px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
            position: relative;
            overflow: hidden;
        }
        .hero-route {
            font-size: 0.9rem;
            color: var(--gold-light);
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .hero-title {
            font-weight: 800;
            letter-spacing: -1px;
            font-size: 2.6rem;
            line-height: 1.1;
            margin-bottom: 8px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .hero-dates {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0;
            font-weight: 500;
        }
        .hero-countdown {
            margin-top: 24px;
            display: inline-flex;
            align-items: baseline;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 12px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        .countdown-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--gold-light);
            line-height: 1;
        }
        .countdown-label {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        /* ====== NAVIGAZIONE A TABS ====== */
        .nav-pills-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            padding: 6px;
            background-color: #ffffff;
            border-radius: 20px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.04);
            position: sticky;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            z-index: 1020;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .nav-pills-grid .nav-item { min-width: 0; }
        .nav-pills-grid .nav-link {
            width: 100%;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border-radius: 14px;
            font-weight: 600;
            color: #64748b;
            transition: all 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .nav-pills-grid .nav-link.active {
            background-color: var(--accent-teal);
            color: white;
            box-shadow: 0 6px 18px rgba(13, 148, 136, 0.35);
        }
        .nav-pills-grid .nav-link:hover:not(.active) {
            color: var(--accent-teal);
            background-color: rgba(13, 148, 136, 0.06);
        }
        .nav-pills-grid .nav-link i { font-size: 1.1rem; }
        .nav-pills-grid .nav-link span {
            font-size: 0.7rem;
            line-height: 1.1;
            display: block;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #pills-tabContent { scroll-margin-top: 90px; }

        /* ====== CARD ====== */
        .custom-card {
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: var(--card-shadow);
            transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1), box-shadow 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            overflow: hidden;
            position: relative;
        }
        @media (hover: hover) {
            .custom-card:hover {
                transform: translateY(-4px);
                box-shadow: var(--card-shadow-hover);
            }
        }

        /* KPI CARDS */
        .kpi-card {
            border: none;
            color: white;
            border-radius: 22px;
            padding: 22px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(13, 148, 136, 0.2);
            background: linear-gradient(135deg, #0d9488, #06b6d4);
            height: 100%;
        }
        .kpi-icon {
            position: absolute;
            right: 15px;
            bottom: 10px;
            font-size: 3.8rem;
            opacity: 0.15;
            transition: transform 0.3s ease;
        }
        .kpi-card:hover .kpi-icon {
            transform: scale(1.1);
        }

        /* SCHEDE VOLI */
        .flight-card {
            background: #ffffff;
            border-radius: 18px;
            border: 1px solid #e2e8f0;
            border-left: 6px solid var(--accent-teal);
            padding: 18px 22px;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            transition: all 0.25s ease;
        }
        .flight-card:hover {
            border-left-color: var(--accent-cyan);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            transform: translateX(2px);
        }
        .flight-route {
            font-size: 1.15rem;
            font-weight: 800;
            color: #0f172a;
        }

        /* HOTEL CARDS */
        .hotel-card-header {
            position: relative;
            height: 210px;
            overflow: hidden;
        }
        .hotel-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .custom-card:hover .hotel-image { transform: scale(1.06); }
        .hotel-badge-city {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: white;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.78rem;
            letter-spacing: 0.4px;
        }
        .hotel-badge-price {
            position: absolute;
            bottom: 14px;
            right: 14px;
            background: var(--accent-teal);
            color: white;
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
        }

        /* DESTINAZIONI */
        .destination-card {
            height: 170px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            background-size: cover;
            background-position: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }
        .destination-card:hover { transform: scale(1.02); }
        .destination-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0.15) 100%);
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            color: white;
        }

        /* TABELLA ITINERARIO */
        .table-custom { margin-bottom: 0; }
        .table-custom th {
            background-color: #f8fafc;
            color: #64748b;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 2px solid #e2e8f0;
            padding: 16px;
        }
        .table-custom td {
            padding: 16px;
            vertical-align: middle;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .table-custom tr.is-today { background-color: rgba(13, 148, 136, 0.06); }

        /* BOTTONI MAPS & AZIONI FLUTTUANTI */
        .card-actions-floating {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
            z-index: 10;
        }
        .btn-maps {
            background: linear-gradient(135deg, #4285F4, #1a73e8);
            color: white;
            font-weight: 700;
            border-radius: 12px;
            padding: 9px 16px;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.25);
            transition: all 0.25s ease;
        }
        .btn-maps:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(66, 133, 244, 0.4);
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            padding: 32px 16px;
        }

        /* INPUTS E FORM MODALI */
        .form-control, .form-select {
            border-radius: 12px;
            padding: 10px 14px;
            border-color: #cbd5e1;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--accent-teal);
            box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.15);
        }

        /* ====== DESKTOP MEDIA QUERIES ====== */
        @media (min-width: 768px) {
            .nav-pills-grid {
                display: flex;
                width: fit-content;
                margin-inline: auto;
                gap: 8px;
                padding: 8px 16px;
            }
            .nav-pills-grid .nav-item { width: auto; }
            .nav-pills-grid .nav-link {
                width: auto;
                flex-direction: row;
                padding: 10px 22px;
                gap: 8px;
            }
            .nav-pills-grid .nav-link span { font-size: 0.875rem; width: auto; }
            .itinerary-scroll { overflow-x: auto; }
        }

        /* ====== MOBILE CARD VIEW PER TABELLA ITINERARIO ====== */
        @media (max-width: 767.98px) {
            .hero-title { font-size: 2.1rem; }
            .table-mobile-cards thead { display: none; }
            .table-mobile-cards, .table-mobile-cards tbody, .table-mobile-cards tr, .table-mobile-cards td {
                display: block;
                width: 100%;
            }
            .table-mobile-cards tr {
                margin-bottom: 1rem;
                background: #ffffff;
                border: 1px solid #e2e8f0;
                border-radius: 20px;
                padding: 14px 18px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            }
            .table-mobile-cards tr.is-today { border-color: var(--accent-teal); border-width: 2px; }
            .table-mobile-cards td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-align: right;
                padding: 10px 0;
                border-bottom: 1px dashed #f1f5f9;
                font-size: 0.88rem;
            }
            .table-mobile-cards td:last-child { border-bottom: none; }
            .table-mobile-cards td::before {
                content: attr(data-label);
                font-weight: 800;
                color: #64748b;
                text-transform: uppercase;
                font-size: 0.7rem;
                letter-spacing: 0.5px;
                text-align: left;
                padding-right: 12px;
            }
            .table-mobile-cards td[data-label="Azioni"] { justify-content: flex-end; }
            .table-mobile-cards td[data-label="Azioni"]::before { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>

<!-- HERO HEADER -->
<header class="hero-banner text-center mb-4">
    <div class="container">
        <p class="hero-route">Bangkok → Chiang Mai → Phuket</p>
        <h1 class="hero-title mb-2">THAILANDIA TRIP</h1>
        <p class="hero-dates"><i class="fa-regular fa-calendar-check me-2"></i>28 dicembre 2026 – 8 gennaio 2027</p>
        <div class="hero-countdown" aria-live="polite">
            <div class="countdown-number" id="days">–</div>
            <div class="countdown-label" id="label">giorni alla partenza</div>
        </div>
    </div>
</header>

<div class="container mb-5">

    <!-- NAVIGAZIONE A TABS -->
    <ul class="nav nav-pills nav-pills-grid mb-4" id="pills-tab" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#dashboard" type="button" role="tab" aria-controls="dashboard" aria-selected="true">
                <i class="fa-solid fa-chart-pie" aria-hidden="true"></i>
                <span>Dashboard</span>
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#itinerario" type="button" role="tab" aria-controls="itinerario" aria-selected="false">
                <i class="fa-solid fa-route" aria-hidden="true"></i>
                <span>Itinerario</span>
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#alloggi" type="button" role="tab" aria-controls="alloggi" aria-selected="false">
                <i class="fa-solid fa-hotel" aria-hidden="true"></i>
                <span>Hotel</span>
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#esperienze" type="button" role="tab" aria-controls="esperienze" aria-selected="false">
                <i class="fa-solid fa-icons" aria-hidden="true"></i>
                <span>Tour</span>
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#info" type="button" role="tab" aria-controls="info" aria-selected="false">
                <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
                <span>Info</span>
            </button>
        </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">

        <!-- 1. DASHBOARD -->
        <div class="tab-pane fade show active" id="dashboard" role="tabpanel">
            <!-- KPI -->
            <div class="row g-3 mb-4" id="statsContainer"></div>

            <!-- RIPARTIZIONE BUDGET -->
            <div class="custom-card p-4 mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="fw-bold mb-
